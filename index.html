<style id="css">
/* 真っ白・シンプル・清潔（白基調＋青アクセント＋グレー、色は最小限） */
:root{
 --ink:#111827; --sub:#6B7280; --line:#E9EAEC; --line2:#F1F2F4;
 --bg:#FFFFFF; --panel:#FAFAFA; --hover:#F7F8FA;
 --accent:#2563EB; --paid:#2563EB; --paidbg:#EFF4FF; --free:#B9C0CB; --freebg:#F4F5F7;
}
*{box-sizing:border-box;}
body{margin:0;font-family:-apple-system,'Hiragino Kaku Gothic ProN','Meiryo',Arial,sans-serif;color:var(--ink);background:var(--bg);-webkit-font-smoothing:antialiased;}
header{background:#fff;padding:26px 26px 18px;border-bottom:1px solid var(--line);}
header h1{margin:0;font-size:22px;font-weight:700;letter-spacing:.01em;}
.corow{margin-top:14px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
.corow label{font-size:12px;color:var(--sub);font-weight:700;}
#company{padding:9px 14px;border:1px solid var(--line);border-radius:10px;font-size:14px;font-weight:700;background:var(--panel);color:var(--ink);cursor:pointer;min-width:220px;}
#company:focus{outline:none;border-color:var(--accent);}
.perbadge{display:inline-flex;align-items:center;gap:6px;padding:8px 13px;border-radius:10px;background:var(--paidbg);border:1px solid #D7E3FF;font-size:13px;font-weight:700;color:var(--accent);}
.perbadge .cal{font-size:12px;}
.dlbtn{display:none;align-items:center;gap:6px;padding:9px 15px;border-radius:10px;background:var(--accent);color:#fff !important;font-size:13px;font-weight:700;text-decoration:none;cursor:pointer;border:1px solid var(--accent);}
.dlbtn:hover{background:#1d4fd8;}
header .meta{margin-top:12px;font-size:12px;color:var(--sub);}
.wrap{max-width:1200px;margin:0 auto;padding:22px 18px 70px;}
.note{font-size:12px;color:var(--sub);background:#fff;border:1px solid var(--line);border-left:3px solid var(--accent);padding:10px 13px;border-radius:8px;margin:16px 0;}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(158px,1fr));gap:12px;}
.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px;}
.card .lbl{font-size:11px;color:var(--sub);font-weight:600;letter-spacing:.02em;}
.card .val{font-size:26px;font-weight:700;margin-top:6px;color:var(--ink);letter-spacing:-.01em;}
.card .val small{font-size:12px;font-weight:500;color:var(--sub);}
h2{font-size:12.5px;margin:30px 0 12px;color:var(--sub);font-weight:700;letter-spacing:.04em;text-transform:none;}
.cmp{background:#fff;border:1px solid var(--line);border-radius:12px;padding:18px;}
.legend{font-size:12px;color:var(--sub);margin-bottom:12px;}
.dot{display:inline-block;width:10px;height:10px;border-radius:3px;vertical-align:-1px;margin-right:5px;}
.cmprow{display:grid;grid-template-columns:84px 1fr;gap:12px;align-items:center;margin:12px 0;}
.cmprow .k{font-size:13px;color:var(--ink);font-weight:600;}
.bar{position:relative;height:22px;background:var(--panel);border-radius:6px;overflow:hidden;margin:5px 0;}
.bar > span{position:absolute;left:0;top:0;bottom:0;border-radius:6px;}
.bar.p > span{background:var(--paid);} .bar.f > span{background:var(--free);}
.bar b{position:absolute;right:9px;top:50%;transform:translateY(-50%);font-size:11px;color:var(--sub);font-weight:700;}
.tabs{display:flex;gap:2px;margin:30px 0 0;border-bottom:1px solid var(--line);}
.tabs button{border:none;background:none;padding:10px 16px;cursor:pointer;font-size:13px;font-weight:700;color:var(--sub);border-bottom:2px solid transparent;margin-bottom:-1px;}
.tabs button.on{color:var(--ink);border-bottom-color:var(--accent);}
.panel{background:#fff;border:1px solid var(--line);border-top:none;border-radius:0 0 12px 12px;padding:14px;}
.tools{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px;align-items:center;}
.tools input{padding:8px 12px;border:1px solid var(--line);border-radius:9px;font-size:13px;background:#fff;color:var(--ink);flex:1;min-width:190px;}
#jamode,#dcamp{padding:8px 12px;border:1px solid var(--accent);border-radius:9px;font-size:13px;font-weight:700;background:var(--paidbg);color:var(--accent);cursor:pointer;max-width:260px;}
.tools input:focus{outline:none;border-color:var(--accent);}
.count{font-size:12px;color:var(--sub);margin-left:auto;font-weight:600;}
.tblwrap{overflow:auto;max-height:66vh;border:1px solid var(--line);border-radius:10px;}
table{border-collapse:collapse;width:100%;font-size:12px;white-space:nowrap;}
th,td{padding:9px 11px;border-bottom:1px solid var(--line2);text-align:right;}
th:first-child,td:first-child,td.l,th.l{text-align:left;}
thead th{position:sticky;top:0;background:#fff;color:var(--sub);cursor:pointer;user-select:none;z-index:1;font-weight:700;border-bottom:1.5px solid var(--line);}
thead th.p{color:var(--accent);} thead th.f{color:#8A93A0;}
tbody tr:hover{background:var(--hover);}
td.pcol{background:var(--paidbg);} td.fcol{background:var(--freebg);}
th .ar{font-size:9px;opacity:.8;}
footer{max-width:1200px;margin:0 auto;padding:0 18px 44px;font-size:11px;color:var(--sub);}
.impbtn{display:inline-flex;align-items:center;gap:6px;padding:9px 15px;border-radius:10px;background:#0F9D58;color:#fff;font-size:13px;font-weight:700;cursor:pointer;border:1px solid #0F9D58;}
.impbtn:hover{background:#0c8a4d;}
.modal{position:fixed;inset:0;background:rgba(17,24,39,.45);display:flex;align-items:center;justify-content:center;padding:16px;z-index:60;}
.sheet{background:#fff;border:1px solid var(--line);border-radius:16px;width:100%;max-width:460px;max-height:90vh;overflow:auto;box-shadow:0 24px 60px rgba(0,0,0,.25);}
.sheet-hd{display:flex;align-items:center;justify-content:space-between;padding:16px 18px;border-bottom:1px solid var(--line);font-weight:700;}
.sheet-bd{padding:18px;display:flex;flex-direction:column;gap:13px;}
.sheet-ft{padding:14px 18px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:8px;}
.fld{display:flex;flex-direction:column;gap:5px;font-size:12px;color:var(--sub);font-weight:700;}
.fld select,.fld input{font:inherit;font-size:14px;color:var(--ink);background:#fff;border:1px solid var(--line);border-radius:9px;padding:9px 11px;font-weight:400;}
.mbtn{font:inherit;font-size:14px;font-weight:700;padding:9px 15px;border-radius:9px;border:1px solid var(--line);background:#fff;color:var(--ink);cursor:pointer;}
.mbtn.primary{background:var(--accent);border-color:var(--accent);color:#fff;}
.mbtn:disabled{opacity:.5;cursor:not-allowed;}
.x{border:none;background:none;font-size:18px;color:var(--sub);cursor:pointer;}
.prev{font-size:13px;background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:11px 13px;}
.msg{font-size:13px;padding:10px 13px;border-radius:9px;background:var(--paidbg);color:var(--ink);}
.msg.err{background:#FDECEA;color:#B3261E;}
.hint{font-size:12px;color:var(--sub);font-weight:400;}
[hidden]{display:none!important;}
.updlog{margin-top:24px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px 18px;}
.updlog h2{margin:0 0 10px;font-size:15px;}
.loglist{list-style:none;margin:0;padding:0;max-height:260px;overflow:auto;}
.loglist li{padding:8px 0;border-top:1px solid var(--line2);font-size:13px;line-height:1.5;color:var(--ink);}
.loglist li:first-child{border-top:none;}
.loglist .ld{display:inline-block;min-width:86px;color:var(--sub);font-weight:700;}

  function syncFields(){var ind=curMedia()=='Indeed';document.getElementById('gInd').hidden=!ind;document.getElementById('gAir').hidden=ind;nw.hidden=co.value!='__new';P=null;IJ=null;paidTxt=null;freeTxt=null;document.getElementById('mgo').disabled=true;document.getElementById('mprev').hidden=true;document.getElementById('mmsg').hidden=true;}
  co.onchange=function(){co.disabled=false;syncFields();};
  document.getElementById('mx').onclick=close;document.getElementById('mcancel').onclick=close;
  document.getElementById('mfile').onchange=function(e){var f=e.target.files[0];if(!f)return;meta=_parseName(f.name);var rd=new FileReader();rd.onload=function(){try{P=_parseAir(rd.result);match=_findAir(meta.id);var pv=document.getElementById('mprev');pv.hidden=false;var head='読み取り：費用 <b>¥'+Math.round(P.total.cost).toLocaleString()+'</b> ／ 応募 <b>'+P.total.ap+'</b> 件 ／ 表示 '+Math.round(P.total.imp).toLocaleString()+' ／ '+P.days.length+'日分';var lab=document.getElementById('mlabel');if(match){var mc=DATA.companies[match.ci],mk=mc.camps[match.cj];co.value=String(match.ci);co.disabled=true;lab.value=mk.camp;pv.innerHTML=head+'<br><b style="color:#0F9D58">✓ 同じ広告が見つかりました</b>：'+mc.name+' ／「'+mk.camp+'」をまとめて更新します。';}else{if(!lab.value)lab.value=meta.name;pv.innerHTML=head+'<br><b style="color:var(--accent)">＋ 新しい広告</b>として追加します。';}document.getElementById('mgo').disabled=false;document.getElementById('mmsg').hidden=true;}catch(err){P=null;msg('CSVを読み取れませんでした。エアワークの「広告詳細」CSVかご確認ください。',1);document.getElementById('mgo').disabled=true;}};rd.readAsText(f);};
  function _classify(text){var rows=_csvObj(text);if(!rows.length)return 'free';var camp=0,cost=0;rows.forEach(function(r){if((r['キャンペーン']||'').trim())camp++;cost+=_num(r['費用']);});return (camp>0&&cost>0)?'paid':'free';}
  function tryIndeed(){
    if(paidTxt){try{IJ=_parseIndeed(paidTxt,freeTxt||'');}catch(err){IJ=null;msg('CSVを読み取れませんでした。Indeedの書き出しCSVかご確認ください。',1);document.getElementById('mgo').disabled=true;return;}var ag=_indAgg(IJ);var pv=document.getElementById('mprev');pv.hidden=false;var mode=document.getElementById('mmode').value;var note=mode=='replace'?'この会社を<b>丸ごと置き換え</b>ます。':'キャンペーン単位で<b>更新</b>（同名は差し替え・新規は追加）します。';pv.innerHTML='読み取り：費用 <b>¥'+Math.round(ag.totals.cost).toLocaleString()+'</b> ／ 応募 <b>'+ag.totals.p_app+'</b> 件 ／ 求人 '+IJ.length+' ／ キャンペーン '+ag.camps.length+' 件'+(freeTxt?'（無料CSVあり）':'（無料CSVなし）')+'<br>'+note;document.getElementById('mgo').disabled=false;document.getElementById('mmsg').hidden=true;return;}
    if(freeTxt){IJ=null;if(co.value=='__new'){msg('無料だけの更新は、既存の会社を選んでください。',1);document.getElementById('mgo').disabled=true;return;}var pv=document.getElementById('mprev');pv.hidden=false;pv.innerHTML='無料CSVを読み取りました。<b>無料の数値だけ</b>を既存の求人に反映します（費用・応募などの有料数値はそのまま）。';document.getElementById('mgo').disabled=false;document.getElementById('mmsg').hidden=true;return;}
    document.getElementById('mgo').disabled=true;document.getElementById('mprev').hidden=true;
  }
  function _readInd(){var f1=document.getElementById('mf1').files[0],f2=document.getElementById('mf2').files[0];var files=[];if(f1)files.push(f1);if(f2)files.push(f2);paidTxt=null;freeTxt=null;IJ=null;if(!files.length){document.getElementById('mgo').disabled=true;document.getElementById('mprev').hidden=true;return;}var pending=files.length;files.forEach(function(f){var rd=new FileReader();rd.onload=function(){var t=rd.result;if(_classify(t)=='paid'){paidTxt=t;}else{freeTxt=t;}pending--;if(pending===0)tryIndeed();};rd.readAsText(f);});}
  document.getElementById('mf1').onchange=_readInd;
  document.getElementById('mf2').onchange=_readInd;
  document.getElementById('mmode').onchange=function(){if(paidTxt||freeTxt)tryIndeed();};
  document.getElementById('mgo').onclick=async function(){
    var media=curMedia(),next=JSON.parse(JSON.stringify(DATA)),C,notifyItems=[];
    if(media=='Indeed'){
      C=next.companies[+co.value];var mode=document.getElementById('mmode').value;
      if(paidTxt&&IJ){
        var up={};IJ.forEach(function(j){up[j.camp]=1;});
        var existing={};(DATA.companies[+co.value].camps||[]).forEach(function(k){existing[k.camp]=1;});
        Object.keys(up).forEach(function(cn){if(!existing[cn]){var e=_endOf(cn);if(e)notifyItems.push({company:C.name,camp:_shortCampJS(cn),end:e});}});
        var newJobs=(mode=='replace')?IJ:((C.jobs||[]).filter(function(j){return !up[j.camp];}).concat(IJ));
        var ag=_indAgg(newJobs);C.jobs=newJobs;C.camps=ag.camps;C.stores=ag.stores;C.totals=ag.totals;C.hasfree=1;C.paid_rows=newJobs.length;C.free_rows=newJobs.filter(function(j){return j.has_free;}).length;var per=_periodFromJobs(newJobs);if(per)C.period=per;
      }else if(freeTxt){
        var free=_csvObj(freeTxt);var fbr={};free.forEach(function(r){if(r['参照番号'])fbr[r['参照番号']]={fi:_num(r['表示回数']),fc:_num(r['クリック数']),fa:_num(r['応募数'])};});
        var matched=0;(C.jobs||[]).forEach(function(j){var fr=j.ref?fbr[j.ref]:null;if(fr){j.f_imp=fr.fi;j.f_clk=fr.fc;j.f_app=fr.fa;j.has_free=1;matched++;}});
        if(!matched){msg('この会社の求人と無料CSVが一致しませんでした（参照番号）。先に有料CSVを1回取り込むと、次回から無料だけの更新ができます。',1);document.getElementById('mgo').disabled=false;return;}
        var ag2=_indAgg(C.jobs);C.camps=ag2.camps;C.stores=ag2.stores;C.totals=ag2.totals;C.free_rows=C.jobs.filter(function(j){return j.has_free;}).length;
      }else{msg('CSVを選んでください。',1);return;}
    }else{
      if(!P){msg('先にCSVを選んでください。',1);return;}
      var label=(document.getElementById('mlabel').value||'').trim();if(!label){msg('広告ラベルを入力してください。',1);return;}
      if(match){C=next.companies[match.ci];C.camps[match.cj]=_airCamp(label,meta.id,P);C.days=C.days.filter(function(d){return d.cid!=(meta.id||'');});C.days=C.days.concat(_airDays(meta.id,label,P));_airRecalc(C);}
      else{if(co.value=='__new'){var nm=(document.getElementById('mnew').value||'').trim();if(!nm){msg('新しい会社名を入力してください。',1);return;}C={name:nm,media:'エアワーク',period:'',hasfree:0,tabs:['K','D'],days:[],paid_rows:0,free_rows:0,report:null,report_file:null,isall:false,totals:{cost:0,p_imp:0,p_clk:0,p_app:0,f_imp:0,f_clk:0,f_app:0,njobs:0,nstore:1,nfree:0,ctr:0,cpa:0},stores:[],jobs:[],camps:[]};next.companies.push(C);}else{C=next.companies[+co.value];}
        var hit=-1;for(var i=0;i<C.camps.length;i++){if(C.camps[i].camp==label){hit=i;break;}}
        if(hit>=0){C.camps[hit]=_airCamp(label,meta.id,P);C.days=C.days.filter(function(d){return d.cid!=(meta.id||label);});}else{C.camps.push(_airCamp(label,meta.id,P));}
        C.days=C.days.concat(_airDays(meta.id,label,P));_airRecalc(C);}
    }
    var d=new Date();next.updated=d.getFullYear()+'/'+(d.getMonth()+1)+'/'+d.getDate();
    document.getElementById('mgo').disabled=true;msg('保存中…',0);
    var art=(window.claude&&window.claude.use)?await window.claude.use('artifact'):null;
    if(!art){msg('このページは閲覧のみのため保存できません（編集権限が必要です）。',1);document.getElementById('mgo').disabled=false;return;}
    var summary={company:C.name,media:media,cost:C.totals.cost,ap:C.totals.p_app,cpa:C.totals.cpa,period:C.period||'',newItems:notifyItems};
    var sr=await _slackImport(summary);var slackNote=sr.ok?' Slackに更新通知を送りました。':' ※Slack通知は送れませんでした（Slack連携が必要かもしれません）。';
    try{await art.publish(buildDoc(next));msg('保存しました。全員のページが最新に更新されます。'+slackNote,0);}catch(err){var code=(err&&err.code)||'';msg(code=='not_writer'||code=='not_granted'?'閲覧のみのため保存できませんでした。':'保存に失敗しました（'+(code||'error')+'）。もう一度お試しください。',1);document.getElementById('mgo').disabled=false;}
  };
  co.value=String(CUR);syncFields();
}
(async function(){try{var a=(window.claude&&window.claude.use)?await window.claude.use('artifact'):null;if(a){var b=document.getElementById('impBtn');if(b)b.hidden=false;}}catch(e){}})();
</script></body></html>
