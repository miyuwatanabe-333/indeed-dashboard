:root{

*{box-sizing:border-box;}
body{margin:0;font-family:-apple-system,'Hiragino Kaku Gothic ProN','Meiryo',Arial,sans-serif;color:var(--ink);background:var(--bg);-webkit-font-smoothing:antialiased;}

#company:focus{outline:none;border-color:var(--accent);}
.perbadge{display:inline-flex;align-items:center;gap:6px;padding:8px 13px;border-radius:10px;background:var(--paidbg);border:1px solid #D7E3FF;font-size:13px;font-weight:700;color:var(--accent);}
.perbadge .cal{font-size:12px;}
.dlbtn{display:none;align-items:center;gap:6px;padding:9px 15px;border-radius:10px;background:var(--accent);color:#fff !important;font-size:13px;font-weight:700;text-decoration:none;cursor:pointer;border:1px solid var(--accent);}

.card .val{font-size:26px;font-weight:700;margin-top:6px;color:var(--ink);letter-spacing:-.01em;}

h2{font-size:12.5px;margin:30px 0 12px;color:var(--sub);font-weight:700;letter-spacing:.04em;text-transform:none;}

.tools{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px;align-items:center;}
.tools input{padding:8px 12px;border:1px solid var(--line);border-radius:9px;font-size:13px;background:#fff;color:var(--ink);flex:1;min-width:190px;}
.tools input:focus{outline:none;border-color:var(--accent);}
.count{font-size:12px;color:var(--sub);margin-left:auto;font-weight:600;}
.tblwrap{overflow:auto;max-height:66vh;border:1px solid var(--line);border-radius:10px;}
table{border-collapse:collapse;width:100%;font-size:12px;white-space:nowrap;}

th:first-child,td:first-child,td.l,th.l{text-align:left;}
thead th{position:sticky;top:0;background:#fff;color:var(--sub);cursor:pointer;user-select:none;z-index:1;font-weight:700;border-bottom:1.5px solid var(--line);}
thead th.p{color:var(--accent);} thead th.f{color:#8A93A0;}
tbody tr:hover{background:var(--hover);}
td.pcol{background:var(--paidbg);} td.fcol{background:var(--freebg);}
th .ar{font-size:9px;opacity:.8;}

.impbtn:hover{background:#0c8a4d;}
.modal{position:fixed;inset:0;background:rgba(17,24,39,.45);display:flex;align-items:center;justify-content:center;padding:16px;z-index:60;}
.sheet{background:#fff;border:1px solid var(--line);border-radius:16px;width:100%;max-width:460px;max-height:90vh;overflow:auto;box-shadow:0 24px 60px rgba(0,0,0,.25);}
.sheet-hd{display:flex;align-items:center;justify-content:space-between;padding:16px 18px;border-bottom:1px solid var(--line);font-weight:700;}

  try{await mcp.callTool('Slack','slack_send_message',{channel_id:'C0BRTG97G4C',message:lines.join('\n')});return {ok:true};}
  catch(e){return {ok:false,reason:(e&&e.code)||'error'};}
}
function buildDoc(data){var css=document.getElementById('css').textContent,app=document.getElementById('appjs').textContent,t=document.getElementById('t').textContent;return '<!DOCTYPE html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">'+'<title id="t">'+t+'</title><style id="css">'+css+'</style></head><body><div id="shell">'+SHELL_TEMPLATE+'</div>'+'<script type="application/json" id="appdata">'+JSON.stringify(data)+'<\/script>'+'<script id="appjs">'+app+'<\/script></body></html>';}
function openImport(){

   +'<label class="fld"><span>取り込み方</span><select id="mmode"><option value="merge">更新（同じキャンペーンを差し替え・新規は追加）</option><option value="replace">この会社を丸ごと置き換え</option></select></label>'
   +'</div>'

   +'<div class="sheet-ft"><button class="mbtn" id="mcancel">キャンセル</button><button class="mbtn primary" id="mgo" disabled>取り込んで全員に反映</button></div></div>';
  document.body.appendChild(m);

  function close(){var el=document.getElementById('impModal');if(el)el.remove();}
  function syncFields(){var ind=curMedia()=='Indeed';document.getElementById('gInd').hidden=!ind;document.getElementById('gAir').hidden=ind;nw.hidden=co.value!='__new';P=null;IJ=null;paidTxt=null;freeTxt=null;document.getElementById('mgo').disabled=true;document.getElementById('mprev').hidden=true;document.getElementById('mmsg').hidden=true;}
  co.onchange=function(){co.disabled=false;syncFields();};
  document.getElementById('mx').onclick=close;document.getElementById('mcancel').onclick=close;
  document.getElementById('mfile').onchange=function(e){var f=e.target.files[0];if(!f)return;meta=_parseName(f.name);var rd=new FileReader();rd.onload=function(){try{P=_parseAir(rd.result);match=_findAir(meta.id);var pv=document.getElementById('mprev');pv.hidden=false;var head='読み取り：費用 <b>¥'+Math.round(P.total.cost).toLocaleString()+'</b> ／ 応募 <b>'+P.total.ap+'</b> 件 ／ 表示 '+Math.round(P.total.imp).toLocaleString()+' ／ '+P.days.length+'日分';var lab=document.getElementById('mlabel');if(match){var mc=DATA.companies[match.ci],mk=mc.camps[match.cj];co.value=String(match.ci);co.disabled=true;lab.value=mk.camp;pv.innerHTML=head+'<br><b style="color:#0F9D58">✓ 同じ広告が見つかりました</b>：'+mc.name+' ／「'+mk.camp+'」をまとめて更新します。';}else{if(!lab.value)lab.value=meta.name;pv.innerHTML=head+'<br><b style="color:var(--accent)">＋ 新しい広告</b>として追加します。';}document.getElementById('mgo').disabled=false;document.getElementById('mmsg').hidden=true;}catch(err){P=null;msg('CSVを読み取れませんでした。エアワークの「広告詳細」CSVかご確認ください。',1);document.getElementById('mgo').disabled=true;}};rd.readAsText(f);};
  function _classify(text){var rows=_csvObj(text);if(!rows.length)return 'free';var camp=0,cost=0;rows.forEach(function(r){if((r['キャンペーン']||'').trim())camp++;cost+=_num(r['費用']);});return (camp>0&&cost>0)?'paid':'free';}
  function tryIndeed(){
    if(paidTxt){try{IJ=_parseIndeed(paidTxt,freeTxt||'');}catch(err){IJ=null;msg('CSVを読み取れませんでした。Indeedの書き出しCSVかご確認ください。',1);document.getElementById('mgo').disabled=true;return;}var ag=_indAgg(IJ);var pv=document.getElementById('mprev');pv.hidden=false;var mode=document.getElementById('mmode').value;var note=mode=='replace'?'この会社を<b>丸ごと置き換え</b>ます。':'キャンペーン単位で<b>更新</b>（同名は差し替え・新規は追加）します。';pv.innerHTML='読み取り：費用 <b>¥'+Math.round(ag.totals.cost).toLocaleString()+'</b> ／ 応募 <b>'+ag.totals.p_app+'</b> 件 ／ 求人 '+IJ.length+' ／ キャンペーン '+ag.camps.length+' 件'+(freeTxt?'（無料CSVあり）':'（無料CSVなし）')+'<br>'+note;document.getElementById('mgo').disabled=false;document.getElementById('mmsg').hidden=true;return;}
    if(freeTxt){IJ=null;if(co.value=='__new'){msg('無料だけの更新は、既存の会社を選んでください。',1);document.getElementById('mgo').disabled=true;return;}var pv=document.getElementById('mprev');pv.hidden=false;pv.innerHTML='無料CSVを読み取りました。<b>無料の数値だけ</b>を既存の求人に反映します（費用・応募などの有料数値はそのまま）。';document.getElementById('mgo').disabled=false;document.getElementById('mmsg').hidden=true;return;}
    document.getElementById('mgo').disabled=true;document.getElementById('mprev').hidden=true;

  function _readInd(){var f1=document.getElementById('mf1').files[0],f2=document.getElementById('mf2').files[0];var files=[];if(f1)files.push(f1);if(f2)files.push(f2);paidTxt=null;freeTxt=null;IJ=null;if(!files.length){document.getElementById('mgo').disabled=true;document.getElementById('mprev').hidden=true;return;}var pending=files.length;files.forEach(function(f){var rd=new FileReader();rd.onload=function(){var t=rd.result;if(_classify(t)=='paid'){paidTxt=t;}else{freeTxt=t;}pending--;if(pending===0)tryIndeed();};rd.readAsText(f);});}
  document.getElementById('mf1').onchange=_readInd;

        var newJobs=(mode=='replace')?IJ:((C.jobs||[]).filter(function(j){return !up[j.camp];}).concat(IJ));
        var ag=_indAgg(newJobs);C.jobs=newJobs;C.camps=ag.camps;C.stores=ag.stores;C.totals=ag.totals;C.hasfree=1;C.paid_rows=newJobs.length;C.free_rows=newJobs.filter(function(j){return j.has_free;}).length;var per=_periodFromJobs(newJobs);if(per)C.period=per;

      else{if(co.value=='__new'){var nm=(document.getElementById('mnew').value||'').trim();if(!nm){msg('新しい会社名を入力してください。',1);return;}C={name:nm,media:'エアワーク',period:'',hasfree:0,tabs:['K','D'],days:[],paid_rows:0,free_rows:0,report:null,report_file:null,isall:false,totals:{cost:0,p_imp:0,p_clk:0,p_app:0,f_imp:0,f_clk:0,f_app:0,njobs:0,nstore:1,nfree:0,ctr:0,cpa:0},stores:[],jobs:[],camps:[]};next.companies.push(C);}else{C=next.companies[+co.value];}
        var hit=-1;for(var i=0;i<C.camps.length;i++){if(C.camps[i].camp==label){hit=i;break;}}

    var sr=await _slackImport(summary);var slackNote=sr.ok?' Slackに更新通知を送りました。':' ※Slack通知は送れませんでした（Slack連携が必要かもしれません）。';
    try{await art.publish(buildDoc(next));msg('保存しました。全員のページが最新に更新されます。'+slackNote,0);}catch(err){var code=(err&&err.code)||'';msg(code=='not_writer'||code=='not_granted'?'閲覧のみのため保存できませんでした。':'保存に失敗しました（'+(code||'error')+'）。もう一度お試しください。',1);document.getElementById('mgo').disabled=false;}
